name: Refactor stable machine visual root

on:
  push:
    branches:
      - fix/visual-runtime-foundation-20260915
    paths:
      - .github/workflows/refactor-stable-machine-visual.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/visual-runtime-foundation-20260915
      - name: Preserve stable visual anchors across rebuilds
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('Assets/Scripts/Production/PhysicalAssemblyController.cs')
          s=p.read_text(encoding='utf-8')
          def replace_once(old,new,label):
              global s
              count=s.count(old)
              if count!=1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              s=s.replace(old,new,1)

          replace_once(
'''        private readonly List<Material> materials=new List<Material>();
        private string signature="";''',
'''        private readonly List<Material> materials=new List<Material>();
        private readonly Dictionary<string,Transform> stableAnchors=new Dictionary<string,Transform>(StringComparer.Ordinal);
        private Transform buildParent;
        private string signature="";''','fields')

          replace_once(
'''        private void Rebuild()
        {
            DestroyVisual();
            MachineState m=game.ActiveMachine;
            if(m==null)return;
            root=new GameObject("ProductionMachine3D");
            root.transform.position=new Vector3(0,1.43f,3.72f);
''',
'''        private void Rebuild()
        {
            MachineState m=game.ActiveMachine;
            if(m==null){if(root!=null)root.SetActive(false);return;}
            EnsureRoot();
            root.SetActive(true);
            ClearBuildContent();
            DestroyMaterials();
''','rebuild-prefix')

          replace_once(
'''            Material ghost=Mat(new Color(.16f,.22f,.28f),.18f,.1f);

            if(string.IsNullOrEmpty(m.caseItemId))''',
'''            Material ghost=Mat(new Color(.16f,.22f,.28f),.18f,.1f);

            BeginAnchor("Case");
            if(string.IsNullOrEmpty(m.caseItemId))''','case-anchor')

          replace_once(
'''            BuildMotherboard(m,board,black,silver,copper,ghost);
            BuildCpuAndCooler(m,copper,silver,black,ghost);
            BuildRam(m,blue,copper,ghost);
            BuildGpu(m,black,silver,ghost);
            BuildPsu(m,black,silver,ghost);
            BuildStorage(m,dark,silver,ghost);
            BuildFans(m,black,silver,ghost);
            BuildCables(m);
            BuildPanelAndFasteners(m,frame,silver);
            BuildPowerButton(m);

            BoxCollider col=root.AddComponent<BoxCollider>();col.size=new Vector3(1.05f,.92f,.72f);
            WorldInteractable rootInteraction=root.AddComponent<WorldInteractable>();rootInteraction.label="Open assembly bench";rootInteraction.priority=4;rootInteraction.maxDistance=3.6f;rootInteraction.action=()=>game.UI?.OpenTab("BENCH");''',
'''            BeginAnchor("Motherboard");BuildMotherboard(m,board,black,silver,copper,ghost);
            BeginAnchor("CpuCooler");BuildCpuAndCooler(m,copper,silver,black,ghost);
            BeginAnchor("Memory");BuildRam(m,blue,copper,ghost);
            BeginAnchor("Gpu");BuildGpu(m,black,silver,ghost);
            BeginAnchor("Psu");BuildPsu(m,black,silver,ghost);
            BeginAnchor("Storage");BuildStorage(m,dark,silver,ghost);
            BeginAnchor("Fans");BuildFans(m,black,silver,ghost);
            BeginAnchor("Cables");BuildCables(m);
            BeginAnchor("Panel");BuildPanelAndFasteners(m,frame,silver);
            BeginAnchor("Controls");BuildPowerButton(m);''','build-anchors')

          replace_once('holder.transform.SetParent(root.transform,false);holder.transform.localPosition=p;',
                       'holder.transform.SetParent(CurrentParent,false);holder.transform.localPosition=p;','ghost-parent')
          replace_once('private GameObject Box(string name,Vector3 localPos,Vector3 scale,Material mat){return BoxLocal(root.transform,name,localPos,scale,mat);}',
                       'private GameObject Box(string name,Vector3 localPos,Vector3 scale,Material mat){return BoxLocal(CurrentParent,name,localPos,scale,mat);}','box-parent')
          replace_once('g.transform.SetParent(root.transform,false);g.transform.localPosition=localPos;',
                       'g.transform.SetParent(CurrentParent,false);g.transform.localPosition=localPos;','cylinder-parent')

          replace_once(
'''        private Material Mat(Color c,float smooth,float metallic=0f){Material m=new Material(shader);m.color=c;if(m.HasProperty("_Smoothness"))m.SetFloat("_Smoothness",smooth);if(m.HasProperty("_Metallic"))m.SetFloat("_Metallic",metallic);materials.Add(m);return m;}
        private void DestroyVisual(){if(root!=null)Destroy(root);root=null;foreach(Material m in materials)if(m!=null)Destroy(m);materials.Clear();}
''',
'''        private Transform CurrentParent => buildParent!=null?buildParent:(root!=null?root.transform:null);

        private void EnsureRoot()
        {
            if(root!=null)return;
            root=new GameObject("ProductionMachine3D");
            root.transform.position=new Vector3(0,1.43f,3.72f);
            BoxCollider col=root.AddComponent<BoxCollider>();col.size=new Vector3(1.05f,.92f,.72f);
            WorldInteractable rootInteraction=root.AddComponent<WorldInteractable>();
            rootInteraction.label="Open assembly bench";rootInteraction.priority=4;rootInteraction.maxDistance=3.6f;
            rootInteraction.action=()=>game.UI?.OpenTab("BENCH");
        }

        private void BeginAnchor(string key)
        {
            EnsureRoot();
            if(!stableAnchors.TryGetValue(key,out Transform anchor)||anchor==null)
            {
                GameObject holder=new GameObject("VisualAnchor_"+key);
                holder.transform.SetParent(root.transform,false);
                anchor=holder.transform;
                stableAnchors[key]=anchor;
            }
            buildParent=anchor;
        }

        private void ClearBuildContent()
        {
            buildParent=null;
            foreach(Transform anchor in stableAnchors.Values)
            {
                if(anchor==null)continue;
                for(int i=anchor.childCount-1;i>=0;i--)Destroy(anchor.GetChild(i).gameObject);
            }
        }

        private Material Mat(Color c,float smooth,float metallic=0f){Material m=new Material(shader);m.color=c;if(m.HasProperty("_Smoothness"))m.SetFloat("_Smoothness",smooth);if(m.HasProperty("_Metallic"))m.SetFloat("_Metallic",metallic);materials.Add(m);return m;}
        private void DestroyMaterials(){foreach(Material m in materials)if(m!=null)Destroy(m);materials.Clear();}
        private void DestroyVisual(){if(root!=null)Destroy(root);root=null;buildParent=null;stableAnchors.Clear();DestroyMaterials();}
''','lifetime-methods')

          p.write_text(s,encoding='utf-8')
          PY
          python Tools/validate_project.py
          git diff --check
          git config user.name "ForgeBench CI"
          git config user.email "actions@users.noreply.github.com"
          git add Assets/Scripts/Production/PhysicalAssemblyController.cs
          git commit -m "Keep stable machine visual anchors across refreshes"
          git push origin HEAD:fix/visual-runtime-foundation-20260915
