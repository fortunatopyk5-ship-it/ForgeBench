name: Export integration source

on:
  push:
    branches:
      - integration/physical-assembly-review
    paths:
      - .github/workflows/export-integration-source.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/physical-assembly-review
      - name: Pack source
        run: |
          tar --exclude=.git -czf ForgeBench-integration-source.tar.gz .
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForgeBench-integration-source
          path: ForgeBench-integration-source.tar.gz
          if-no-files-found: error
          retention-days: 1
