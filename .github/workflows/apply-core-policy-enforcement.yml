name: Apply core policy enforcement

on:
  push:
    branches:
      - integration/core-policy-enforcement
    paths:
      - .github/workflows/apply-core-policy-enforcement.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/core-policy-enforcement
          fetch-depth: 1
      - name: Apply guarded integration patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              found=text.count(old)
              if found < count:
                  raise SystemExit(f'{path}: expected at least {count} match(es), found {found}: {old[:90]!r}')
              text=text.replace(old,new,count)
              p.write_text(text,encoding='utf-8')

          replace('Assets/Scripts/Simulation/GameSimulation.cs',
              '            if (j == null || m == null) return ActionResult.Fail("Job or device state missing.");\n            List<string> miss = new List<string>();',
              '            if (j == null || m == null) return ActionResult.Fail("Job or device state missing.");\n            if (SpecialistJobService.IsSpecialist(j)) return ActionResult.Fail("Specialist contracts must be delivered through the specialist workstation.");\n            List<string> miss = new List<string>();')

          replace('Assets/Scripts/Runtime/GameRuntime.cs',
              '        public void Install(string instanceId)\n        {',
              '''        private ActionResult BenchCustodyGuard()\n        {\n            JobState job = ActiveJob;\n            if (job == null) return ActionResult.Success("No active customer custody record.");\n            ServiceIntakeService service = ServiceIntakeDirector.Instance?.Service;\n            return service == null ? ActionResult.Success("Intake service unavailable; legacy bench path allowed.") : service.CanBeginWork(job.jobId);\n        }\n\n        private ActionResult ReleaseCustodyGuard()\n        {\n            JobState job = ActiveJob;\n            if (job == null) return ActionResult.Success("No active customer custody record.");\n            ServiceIntakeService service = ServiceIntakeDirector.Instance?.Service;\n            return service == null ? ActionResult.Success("Intake service unavailable; legacy release path allowed.") : service.CanRelease(job.jobId);\n        }\n\n        public void Install(string instanceId)\n        {''')
          replace('Assets/Scripts/Runtime/GameRuntime.cs',
              '            if (m == null) { Notify("Accept a job first.", false); return; }\n            if (item == null || item.reserved) { Notify("Part is unavailable.", false); return; }',
              '            if (m == null) { Notify("Accept a job first.", false); return; }\n            ActionResult custody = BenchCustodyGuard(); if (!custody.ok) { Notify(custody.message, false); return; }\n            if (item == null || item.reserved) { Notify("Part is unavailable.", false); return; }')
          replace('Assets/Scripts/Runtime/GameRuntime.cs',
              '            if (m == null || item == null) return;\n            HardwareDefinition removing = Inventory.Def(item);',
              '            if (m == null || item == null) return;\n            ActionResult custody = BenchCustodyGuard(); if (!custody.ok) { Notify(custody.message, false); return; }\n            HardwareDefinition removing = Inventory.Def(item);')
          replace('Assets/Scripts/Runtime/GameRuntime.cs',
              '            if (m == null) { Notify("No device on bench.", false); return; }\n            HardwareDefinition board = Inventory.Def(Inventory.Get(m.motherboardItemId));',
              '            if (m == null) { Notify("No device on bench.", false); return; }\n            ActionResult custody = BenchCustodyGuard(); if (!custody.ok) { Notify(custody.message, false); return; }\n            HardwareDefinition board = Inventory.Def(Inventory.Get(m.motherboardItemId));')
          replace('Assets/Scripts/Runtime/GameRuntime.cs',
              '            if (m == null || string.IsNullOrEmpty(m.cpuItemId)) { Notify("Install a CPU first.", false); return; }\n            ItemInstance paste = Inventory.Available(PartCategory.Consumable)',
              '            if (m == null || string.IsNullOrEmpty(m.cpuItemId)) { Notify("Install a CPU first.", false); return; }\n            ActionResult custody = BenchCustodyGuard(); if (!custody.ok) { Notify(custody.message, false); return; }\n            ItemInstance paste = Inventory.Available(PartCategory.Consumable)')
          replace('Assets/Scripts/Runtime/GameRuntime.cs',
              '            if (m == null) { Notify("No device on bench.", false); return; }\n            ItemInstance air = Inventory.Available(PartCategory.Consumable)',
              '            if (m == null) { Notify("No device on bench.", false); return; }\n            ActionResult custody = BenchCustodyGuard(); if (!custody.ok) { Notify(custody.message, false); return; }\n            ItemInstance air = Inventory.Available(PartCategory.Consumable)')
          replace('Assets/Scripts/Runtime/GameRuntime.cs',
              '            ActionResult validation = Jobs.Validate(j, m);',
              '            ActionResult release = ReleaseCustodyGuard(); if (!release.ok) { Notify(release.message, false); Refresh(); return; }\n            ActionResult validation = Jobs.Validate(j, m);')

          replace('Tools/validate_project.py',
              "'Assets/Scripts/Production/WarrantyDirector.cs','Assets/Scripts/Production/WarrantyPanel.cs','Assets/Scripts/Production/WarrantyTerminalLayer.cs','Assets/Scripts/Production/WarrantySpecialistBridge.cs','Assets/Scripts/Production/OperationsDashboardPanel.cs','Assets/Scripts/Production/OperationsTerminalLayer.cs',",
              "'Assets/Scripts/Production/WarrantyDirector.cs','Assets/Scripts/Production/WarrantyPanel.cs','Assets/Scripts/Production/WarrantyTerminalLayer.cs','Assets/Scripts/Production/WarrantySpecialistBridge.cs','Assets/Scripts/Production/OperationsDashboardPanel.cs','Assets/Scripts/Production/OperationsTerminalLayer.cs',\n'Assets/Scripts/Production/ServiceIntakeDirector.cs','Assets/Scripts/Production/ServiceIntakePanel.cs','Assets/Scripts/Production/ServiceIntakeTerminalLayer.cs','Assets/Scripts/Production/ToolCalibrationDirector.cs','Assets/Scripts/Production/ToolCalibrationPanel.cs','Assets/Scripts/Production/ToolCalibrationTerminalLayer.cs',")
          replace('Tools/validate_project.py',
              "'Assets/Scripts/Simulation/CustomerRelationsService.cs','Assets/Scripts/Simulation/ProgressionService.cs','Assets/Scripts/Simulation/ReliabilitySimulationService.cs','Assets/Scripts/Simulation/PreflightInspectionService.cs','Assets/Scripts/Simulation/StaffRosterService.cs','Assets/Scripts/Simulation/WarrantyService.cs',",
              "'Assets/Scripts/Simulation/CustomerRelationsService.cs','Assets/Scripts/Simulation/ProgressionService.cs','Assets/Scripts/Simulation/ReliabilitySimulationService.cs','Assets/Scripts/Simulation/PreflightInspectionService.cs','Assets/Scripts/Simulation/StaffRosterService.cs','Assets/Scripts/Simulation/WarrantyService.cs','Assets/Scripts/Simulation/ServiceIntakeService.cs','Assets/Scripts/Simulation/ToolCalibrationService.cs',")
          replace('Tools/validate_project.py',
              "'Assets/Scripts/Editor/ForgeBenchEditorSetup.cs','Assets/Scripts/Editor/ProductionBuildGate.cs','Assets/Tests/EditMode/EngineeringSimulationTests.cs','Assets/Tests/EditMode/SpecialistSimulationTests.cs','Assets/Tests/EditMode/WorkshopBusinessTests.cs','Assets/Tests/EditMode/SupplyChainJobTests.cs','Assets/Tests/EditMode/ProgressionTests.cs','Assets/Tests/EditMode/ReliabilitySimulationTests.cs','Assets/Tests/EditMode/WarrantyServiceTests.cs','Assets/Tests/EditMode/CrashTelemetryTests.cs',",
              "'Assets/Scripts/Editor/ForgeBenchEditorSetup.cs','Assets/Scripts/Editor/ProductionBuildGate.cs','Assets/Tests/EditMode/EngineeringSimulationTests.cs','Assets/Tests/EditMode/SpecialistSimulationTests.cs','Assets/Tests/EditMode/WorkshopBusinessTests.cs','Assets/Tests/EditMode/SupplyChainJobTests.cs','Assets/Tests/EditMode/ProgressionTests.cs','Assets/Tests/EditMode/ReliabilitySimulationTests.cs','Assets/Tests/EditMode/WarrantyServiceTests.cs','Assets/Tests/EditMode/ServiceIntakeTests.cs','Assets/Tests/EditMode/ToolCalibrationTests.cs','Assets/Tests/EditMode/CrashTelemetryTests.cs',")
          replace('Tools/validate_project.py',
              "    if re.search(r'\\b[A-Za-z_]\\w*\\?\\.\\d',txt):fail('suspicious C# ternary',rel)\n",
              "    # Do not regex-guess compact C# ternaries such as condition?.5f:other; Unity compilation is authoritative.\n")
          replace('Tools/validate_project.py',
              "'StaffRosterService','WarrantyService','WarrantyDirector','WarrantySpecialistBridge','OperationsDashboardPanel'",
              "'StaffRosterService','WarrantyService','ServiceIntakeService','ToolCalibrationService','WarrantyDirector','WarrantySpecialistBridge','OperationsDashboardPanel'")
          replace('Tools/validate_project.py',
              "for t in ['EngineeringSimulationTests.cs','ProgressionTests.cs','ReliabilitySimulationTests.cs','WarrantyServiceTests.cs','CrashTelemetryTests.cs']:",
              "for t in ['EngineeringSimulationTests.cs','ProgressionTests.cs','ReliabilitySimulationTests.cs','WarrantyServiceTests.cs','ServiceIntakeTests.cs','ToolCalibrationTests.cs','CrashTelemetryTests.cs']:")
          PY
          python Tools/validate_project.py
          python Tools/smoke_balance_test.py
          git diff --check
      - name: Commit guarded integration
        shell: bash
        run: |
          git config user.name "fortunatopyk5-ship-it"
          git config user.email "fortunatopyk5@gmail.com"
          git add Assets/Scripts/Simulation/GameSimulation.cs Assets/Scripts/Runtime/GameRuntime.cs Tools/validate_project.py
          git commit -m "Enforce intake custody and specialist submission routing"
          git push origin HEAD:integration/core-policy-enforcement
