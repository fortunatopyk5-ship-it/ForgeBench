name: Fix art manifest fingerprint

on:
  push:
    branches:
      - art/visual-production-plan-20260915
    paths:
      - .github/workflows/fix-art-fingerprint.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/visual-production-plan-20260915
      - name: Update manifest fingerprint
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('.')
          catalog = root / 'Assets/Resources/Data/hardware.json'
          manifest_path = root / 'Docs/hardware_visual_profiles.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['catalogSha256'] = hashlib.sha256(catalog.read_bytes()).hexdigest()
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print('catalogSha256 =', manifest['catalogSha256'])
          PY
          git config user.name "ForgeBench CI"
          git config user.email "actions@users.noreply.github.com"
          git add Docs/hardware_visual_profiles.json
          if git diff --cached --quiet; then
            echo "Fingerprint already current"
          else
            git commit -m "Refresh art manifest catalog fingerprint"
            git push origin HEAD:art/visual-production-plan-20260915
          fi
