name: Refine hardware presentation consistency

on:
  push:
    branches: [polish/hardware-visual-fidelity-20260915]
    paths: [.github/workflows/refine-hardware-consistency.yml]

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/hardware-visual-fidelity-20260915
      - name: Align runtime capacity and production gates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          sim=Path('Assets/Scripts/Simulation/GameSimulation.cs')
          text=sim.read_text()
          old='''                case PartCategory.RAM:\n                    if (board != null && board.memoryType != p.memoryType) return ActionResult.Fail("RAM " + p.memoryType + " does not match board " + board.memoryType + ".");\n                    if (m.ramItemIds.Count >= 4) return ActionResult.Fail("All DIMM slots are occupied.");\n                    break;'''
          new='''                case PartCategory.RAM:\n                    if (board != null && board.memoryType != p.memoryType) return ActionResult.Fail("RAM " + p.memoryType + " does not match board " + board.memoryType + ".");\n                    int dimmCapacity = board != null && board.dimmSlots > 0 ? board.dimmSlots : 4;\n                    if (m.ramItemIds.Count >= dimmCapacity) return ActionResult.Fail("All " + dimmCapacity + " DIMM slots are occupied.");\n                    break;'''
          if old not in text:
              raise SystemExit('RAM compatibility block not found')
          sim.write_text(text.replace(old,new,1))

          gate=Path('Assets/Scripts/Editor/ProductionBuildGate.cs')
          text=gate.read_text()
          old='''"Assets/Scripts/Production/ProductionBootstrap.cs","Assets/Scripts/Production/MainMenuController.cs","Assets/Scripts/Production/WorkshopProductionLayer.cs","Assets/Scripts/Production/PhysicalAssemblyController.cs","Assets/Scripts/Production/ObjectHandlingController.cs"'''
          new='''"Assets/Scripts/Production/ProductionBootstrap.cs","Assets/Scripts/Production/MainMenuController.cs","Assets/Scripts/Production/WorkshopProductionLayer.cs","Assets/Scripts/Production/PhysicalAssemblyController.cs","Assets/Scripts/Production/HardwarePresentationLayout.cs","Assets/Scripts/Production/ObjectHandlingController.cs"'''
          if old not in text:
              raise SystemExit('production critical-file anchor not found')
          text=text.replace(old,new,1)
          old='''            "Assets/Tests/EditMode/FitmentPlanningTests.cs",\n            "Assets/Tests/EditMode/JobDispatchTests.cs",'''
          new='''            "Assets/Tests/EditMode/FitmentPlanningTests.cs",\n            "Assets/Tests/EditMode/HardwarePresentationLayoutTests.cs",\n            "Assets/Tests/EditMode/JobDispatchTests.cs",'''
          if old not in text:
              raise SystemExit('critical-test anchor not found')
          gate.write_text(text.replace(old,new,1))
          PY
          python Tools/validate_project.py
          python Tools/validate_art_profiles.py
          python Tools/smoke_balance_test.py
          git diff --check
      - name: Commit consistency fixes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Assets/Scripts/Simulation/GameSimulation.cs Assets/Scripts/Editor/ProductionBuildGate.cs
          git commit -m "Align hardware capacity and presentation build gates" || exit 0
          git push origin HEAD:polish/hardware-visual-fidelity-20260915
