name: Refine physical interaction source

on:
  push:
    branches: [polish/physical-interaction-preview-20260915]
    paths: [.github/workflows/refine-physical-interaction.yml]

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/physical-interaction-preview-20260915
      - name: Cache physical sockets and validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('Assets/Scripts/Production/ObjectHandlingController.cs')
          text=p.read_text()

          old='''        private SnapPreviewState lastPreviewState = SnapPreviewState.None;\n\n        private static readonly Color PanelNeutral'''
          new='''        private SnapPreviewState lastPreviewState = SnapPreviewState.None;\n        private AssemblySnapPoint[] cachedSnapPoints = Array.Empty<AssemblySnapPoint>();\n        private bool snapPointsDirty = true;\n\n        private static readonly Color PanelNeutral'''
          if old not in text: raise SystemExit('field anchor missing')
          text=text.replace(old,new,1)

          old='''        private void OnStateChanged(object payload) { dirty = true; }'''
          new='''        private void OnStateChanged(object payload) { dirty = true; snapPointsDirty = true; }'''
          if old not in text: raise SystemExit('state anchor missing')
          text=text.replace(old,new,1)

          old='''            ClearPreview();\n            UpdateSnapStatus(SnapPreviewState.None, "Move the component near a compatible installation point.");'''
          new='''            ClearPreview();\n            RefreshSnapPoints();\n            UpdateSnapStatus(SnapPreviewState.None, "Move the component near a compatible installation point.");'''
          if old not in text: raise SystemExit('pickup anchor missing')
          text=text.replace(old,new,1)

          old='''            ActionResult compatible = PhysicalCompatibility(machine, item, def);\n            AssemblySnapPoint[] points = FindObjectsByType<AssemblySnapPoint>(FindObjectsSortMode.None);\n            AssemblySnapPoint best = null;'''
          new='''            ActionResult compatible = PhysicalCompatibility(machine, item, def);\n            if (snapPointsDirty) RefreshSnapPoints();\n            AssemblySnapPoint[] points = cachedSnapPoints;\n            AssemblySnapPoint best = null;'''
          if old not in text: raise SystemExit('scan anchor missing')
          text=text.replace(old,new,1)

          old='''        private ActionResult PhysicalCompatibility(MachineState machine, ItemInstance item, HardwareDefinition def)'''
          new='''        private void RefreshSnapPoints()\n        {\n            cachedSnapPoints = FindObjectsByType<AssemblySnapPoint>(FindObjectsSortMode.None);\n            snapPointsDirty = false;\n        }\n\n        private ActionResult PhysicalCompatibility(MachineState machine, ItemInstance item, HardwareDefinition def)'''
          if old not in text: raise SystemExit('refresh insertion anchor missing')
          text=text.replace(old,new,1)

          old='''\n            public static implicit operator SocketCandidate((AssemblySnapPoint point, SnapPreviewResult result, string reason) value)\n            {\n                return new SocketCandidate(value.point, value.result, value.reason);\n            }'''
          if old not in text: raise SystemExit('implicit operator anchor missing')
          text=text.replace(old,'',1)
          p.write_text(text)
          PY
          python Tools/validate_project.py
          python Tools/validate_art_profiles.py
          python Tools/smoke_balance_test.py
          git diff --check
      - name: Commit socket cache refinement
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Assets/Scripts/Production/ObjectHandlingController.cs
          git commit -m "Cache physical installation sockets during held-part interaction" || exit 0
          git push origin HEAD:polish/physical-interaction-preview-20260915
