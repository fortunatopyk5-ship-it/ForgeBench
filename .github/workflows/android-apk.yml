name: Build ForgeBench Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/android-apk.yml'
      - '.ci/source/**'

permissions:
  contents: write

jobs:
  build-android:
    name: Unity 6 Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: One-time expand archived source into normal Unity files
        shell: bash
        run: |
          set -euxo pipefail
          if [ -f ProjectSettings/ProjectVersion.txt ]; then
            echo "Plain Unity source already exists; no migration needed."
            exit 0
          fi

          echo "Expanding the already-uploaded archive once on GitHub runner..."
          cat .ci/source/part-00-s*.b64 \
              .ci/source/part-0[1-9].b64 \
              .ci/source/part-10.b64 \
              .ci/source/part-11.b64 > /tmp/forgebench.zip.b64
          base64 --decode /tmp/forgebench.zip.b64 > /tmp/forgebench.zip
          unzip -t /tmp/forgebench.zip
          rm -rf /tmp/forgebench-expanded
          mkdir -p /tmp/forgebench-expanded
          unzip -q /tmp/forgebench.zip -d /tmp/forgebench-expanded
          cp -a /tmp/forgebench-expanded/. .

          test -f ProjectSettings/ProjectVersion.txt
          test -f Assets/Scenes/Workshop.unity
          test -f Assets/Resources/Data/hardware.json
          grep -F '6000.3.15f1' ProjectSettings/ProjectVersion.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets Packages ProjectSettings Tools README.md .gitignore
          if [ -d Docs ]; then git add Docs; fi
          if ! git diff --cached --quiet; then
            git commit -m "Expand ForgeBench Unity source into repository [skip ci]"
            git push origin HEAD:main || echo "::warning::Could not push expanded source; this run can still build from the expanded working tree."
          fi

      - name: Validate source tree
        shell: bash
        run: |
          set -euxo pipefail
          test -f ProjectSettings/ProjectVersion.txt
          test -f Assets/Scenes/Workshop.unity
          test -f Assets/Resources/Data/hardware.json
          test -f Assets/Scripts/Editor/ForgeBenchEditorSetup.cs
          grep -F '6000.3.15f1' ProjectSettings/ProjectVersion.txt
          python3 Tools/validate_project.py
          python3 Tools/smoke_balance_test.py

      - name: Free disk space for Unity Android toolchain
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Build ForgeBench APK with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: 6000.3.15f1
          targetPlatform: Android
          androidExportType: androidPackage
          buildMethod: ForgeBench.EditorTools.ForgeBenchEditorSetup.BuildAndroid
          allowDirtyBuild: true

      - name: Verify APK output
        shell: bash
        run: |
          set -euxo pipefail
          test -s Builds/Android/ForgeBench.apk
          ls -lh Builds/Android/ForgeBench.apk
          sha256sum Builds/Android/ForgeBench.apk | tee Builds/Android/ForgeBench.apk.sha256

      - name: Upload ForgeBench APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForgeBench-Android-APK
          path: |
            Builds/Android/ForgeBench.apk
            Builds/Android/ForgeBench.apk.sha256
          if-no-files-found: error
          retention-days: 30
